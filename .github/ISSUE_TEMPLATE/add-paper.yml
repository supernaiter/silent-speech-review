name: Suggest a paper
description: Suggest a silent speech interface paper to review
title: "Add paper: "
labels: ["add-paper"]
body:
  - type: input
    id: link
    attributes:
      label: Paper link
      description: DOI, arXiv or publisher URL
    validations:
      required: true
  - type: input
    id: sensor
    attributes:
      label: Sensor
      description: e.g. lip video, ultrasound, EMG, EEG, EPG, radar, acoustic
  - type: textarea
    id: why
    attributes:
      label: Why it belongs here
      description: Optional. What it measures and under which conditions (vocabulary, speakers, sessions, online/offline).
