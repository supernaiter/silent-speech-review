name: Report an error
description: Report a factual error in a review
title: "Correction: "
labels: ["correction"]
body:
  - type: input
    id: paper
    attributes:
      label: Paper
      description: Title or link to the review page
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: What is wrong
      description: Quote the field and say what the paper actually reports, with the section or table number.
    validations:
      required: true
